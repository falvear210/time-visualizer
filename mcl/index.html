<!DOCTYPE html>
<!--
  The Modern & Classical Languages (MCL) office wall display. A sibling of
  math/index.html: same SLUH theme, same "runs unattended full-screen on a
  TV" job, same data.js for the school calendar -- but built for the
  languages department instead of math.

  What's different from math-office:
    - a rotating saying in the header: a proverb in one of the taught
      languages, with its English translation underneath (mcl-sayings.csv)
    - "Languages Teaching Now" instead of a plain teacher list -- each row
      carries the language + level being taught
    - a WORLD MAP panel in place of "Year at a Glance": it rotates between
      shading the countries behind each language taught, the department's
      exchange-partner schools, the places SLUH travels during the year, and
      the international Senior Project sites -- the last three showing one
      place at a time as a pulsing dot + name
    - the rotating box carries a "Cultural Calendar" of upcoming festivities
      and national days for the countries behind the taught languages, plus
      the next meeting of each cultural / affinity club
    - weather shows St. Louis plus a two-row grid of cities around the
      language world, each with its temperature and current local time

  Structure only: every element with an id="mcl-..." is filled in by
  mcl-office.js at runtime. Bump the ?v= cache-busters below when CSS/JS
  changes. See README.md ("The MCL office wall display") for the full tour.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Languages Office Dashboard</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="stylesheet" href="mcl-office.css?v=22">
</head>
<body>
<div class="mcl-dashboard">
  <header class="mcl-header">
    <div class="mcl-header-title">
      <h1>Languages Office Dashboard</h1>
      <a class="mcl-header-link" href="../">SLUH Time Visualizer</a>
    </div>
    <!-- hidden in production; shown by JS when DEMO_MODE is true -->
    <div class="mcl-demo-badge" id="mcl-demo-badge" hidden>DEMO · 100×</div>
    <!-- a proverb in one of the taught languages, with its English meaning
         and the dim language / romanization tag sharing the line below it.
         dir="auto" lets the browser lay the Arabic rows out right-to-left
         on their own. -->
    <div class="mcl-header-saying" id="mcl-saying-box">
      <div class="mcl-saying-text" id="mcl-saying" dir="auto"></div>
      <div class="mcl-saying-gloss">
        <span class="mcl-saying-en" id="mcl-saying-en"></span>
        <span class="mcl-saying-tag" id="mcl-saying-tag"></span>
      </div>
    </div>
    <div class="mcl-header-time">
      <span id="mcl-date"></span>
      <span id="mcl-clock"></span>
    </div>
  </header>

  <div class="mcl-columns">
    <section class="mcl-col">
      <h2 id="mcl-rotator-title">Cultural Calendar</h2>
      <div class="mcl-col-body">
        <div id="mcl-rotator-body" class="mcl-rotator-content"></div>
      </div>
    </section>

    <section class="mcl-col mcl-map-col">
      <div class="mcl-col-header-row">
        <h2 id="mcl-map-title">World Map</h2>
        <span class="mcl-map-sub" id="mcl-map-sub"></span>
      </div>
      <div class="mcl-col-body">
        <div class="mcl-map-wrap" id="mcl-map-wrap">
          <div class="mcl-map-stage" id="mcl-map-stage">
            <div class="mcl-map-svg" id="mcl-map-svg"></div>
          </div>
          <div class="mcl-map-pins" id="mcl-map-pins"></div>
        </div>
        <div class="mcl-map-legend" id="mcl-map-legend"></div>
      </div>
    </section>

    <section class="mcl-col">
      <h2>Today's Schedule</h2>
      <div class="mcl-col-body">
        <div id="mcl-daily-status"></div>
        <div id="mcl-daily-bars"></div>
      </div>
    </section>
  </div>

  <div class="mcl-bottom">
    <section class="mcl-col">
      <div class="mcl-col-header-row">
        <h2>Languages Teaching Now</h2>
        <span class="mcl-teachers-period" id="mcl-teachers-period"></span>
      </div>
      <div class="mcl-col-body">
        <ul class="mcl-people-list" id="mcl-people-list"></ul>
      </div>
    </section>

    <section class="mcl-col">
      <h2>Weather</h2>
      <div class="mcl-col-body">
        <div class="mcl-weather" id="mcl-weather"></div>
      </div>
    </section>
  </div>
</div>

<script src="../data.js"></script>
<script src="mcl-office.js?v=22"></script>
<script>
  // Fields for analytics.alvear.cl's automatic "view" event (see a.js).
  window.xaExtra = function () {
    var device = Math.min(screen.width || 9999, screen.height || 9999) <= 600 ? "mobile" : "desktop";
    return { page: "mcl-office", theme: "light", device: device };
  };
</script>
<script src="https://analytics.alvear.cl/a.js" data-site="time-visualizer" defer></script>
<script src="https://analytics.alvear.cl/feedback.js" data-site="time-visualizer" defer></script>
</body>
</html>
