# OPTIONAL. The stats endpoint keeps its data and key in two dotfiles next
# to stats.php:  .stats-data.json  and  .stats-key.txt
#
# WordOps' stock nginx config already denies all dotfiles
# (`location ~ /\.` in /etc/nginx/common/locations-wo.conf), so on this host
# nothing here is needed -- just confirm it:
#
#   curl -sI https://sluhtime.alvear.cl/.stats-data.json   # expect 403
#   curl -sI https://sluhtime.alvear.cl/.stats-key.txt     # expect 403
#
# If for some reason those come back 200, paste this into the
# sluhtime.alvear.cl vhost (/etc/nginx/sites-available/sluhtime.alvear.cl),
# inside `server { ... }`, then: sudo nginx -t && sudo systemctl reload nginx

location ~ /\.stats- {
    deny all;
    return 404;
}
