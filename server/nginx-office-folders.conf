# Redirect the old flat dashboard URLs to their new folders.
#
#   /math-office.html  ->  /math/
#   /mcl-office.html   ->  /mcl/
#
# The dashboards moved into folders so that every SLUH Time project can
# live at a URL ending in "/" (room for more siblings later). The old
# paths still have live bookmarks and at least one Pi kiosk pointed at
# them, so they must keep working indefinitely.
#
# Install it as its own include file rather than editing the vhost:
#
#   /var/www/sluhtime.alvear.cl/conf/nginx/office-folders.conf
#
# The vhost already has `include /var/www/sluhtime.alvear.cl/conf/nginx/*.conf;`
# (last line of its server block), so a file dropped there is picked up on the
# next reload and survives `wo` updates -- the same pattern analytics.alvear.cl
# uses. server/README.md has a one-liner that writes it and reloads nginx.
# Then:  sudo nginx -t && sudo systemctl reload nginx
#
# `location =` is an exact match, which nginx checks before any regex
# location, so these win over the static-file handler that would otherwise
# serve the redirect stubs (math-office.html / mcl-office.html) sitting at
# those paths. Those stubs are the fallback if this block is never pasted
# or is later removed -- see the comment at the top of either file.
#
# `permanent` = 301, cached by browsers and search engines. nginx re-appends
# the original query string on its own, and the URL #hash never leaves the
# browser, so deep links survive with no help from us.

location = /math-office.html {
    return 301 https://sluhtime.alvear.cl/math/;
}

location = /mcl-office.html {
    return 301 https://sluhtime.alvear.cl/mcl/;
}

# Tell browsers not to cache index.html for any dashboard.
# The CSS and JS already have ?v= cache-busters in index.html, so they can
# be cached freely. The HTML itself has no buster -- a stale cached index.html
# that references old ?v= numbers loads the new JS against old DOM elements
# and crashes. `no-cache` lets the browser store the file but requires a
# revalidation (304 Not Modified if unchanged) before using it, so a
# warm visit is still fast but a stale copy can't survive a deploy.
location ~ ^/(math|mcl|ilab)/index\.html$ {
    expires -1;
    add_header Cache-Control "no-cache, must-revalidate";
}
# The bare folder URL (/) is served as index.html but nginx doesn't rewrite
# the path -- it reads the file directly, so a separate block is needed.
location = /math/ {
    expires -1;
    add_header Cache-Control "no-cache, must-revalidate";
}
location = /mcl/ {
    expires -1;
    add_header Cache-Control "no-cache, must-revalidate";
}
location = /ilab/ {
    expires -1;
    add_header Cache-Control "no-cache, must-revalidate";
}
location = / {
    expires -1;
    add_header Cache-Control "no-cache, must-revalidate";
}
