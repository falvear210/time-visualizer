# Redirect the old URL to the new subdomain.
#
# The site used to live at  static.alvear.cl/sluh-time-visualizer/
# It now lives at           sluhtime.alvear.cl/
# (moved to its own subdomain so the host can run PHP for it.)
#
# Paste this block inside the `server { ... }` of the static.alvear.cl
# vhost -- under WordOps that's /etc/nginx/sites-available/static.alvear.cl.
# Then:  sudo nginx -t && sudo systemctl reload nginx
#
# `^~` means "if the request path starts with this prefix, use this block
# and stop looking" -- so it wins over WordOps's own regex location blocks
# (static-file handlers, etc.) that would otherwise try to serve the stale
# files still sitting in the old directory.
#
# The `(.*)` capture carries the rest of the path through, so deep links
# survive:
#   /sluh-time-visualizer/math-office.html -> https://sluhtime.alvear.cl/math-office.html
# `rewrite ... permanent` re-appends the original query string on its own.
# The URL #hash (e.g. #dashboard) never leaves the browser, so it is
# preserved with no help from us.
#
# `permanent` = 301: browsers and search engines will cache it. If you
# think you might move again soon, use `redirect` (302) while deciding.

location ^~ /sluh-time-visualizer/ {
    rewrite ^/sluh-time-visualizer/(.*)$ https://sluhtime.alvear.cl/$1 permanent;
}

# Bare /sluh-time-visualizer (no trailing slash) -> site root.
location = /sluh-time-visualizer {
    return 301 https://sluhtime.alvear.cl/;
}
