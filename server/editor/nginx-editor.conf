# The live editor: https://sluhtime.alvear.cl/edit/  (password-protected)
#
# Installed as /var/www/sluhtime.alvear.cl/conf/nginx/editor.conf -- WordOps
# includes that folder in the site's server block and leaves it alone on
# updates. After editing it there:  nginx -t && systemctl reload nginx
#
# /edit/      the same pages as the public /editor/ preview (served from
#             htdocs/editor/), but preview-mode.js lets them save here.
# /edit/api/  their Save buttons, handed to the editor service
#             (sluhtime-editor.service, editor/server.py on 127.0.0.1:8421).
# Both sit behind one password file, with one user: Fernando.

location = /edit { return 301 /edit/; }

# ^~ stops nginx from also trying the site's regex locations (PHP, the
# long-cache rule for .js/.css), so everything under /edit/ is handled here.
location ^~ /edit/ {
    auth_basic "SLUH time editor";
    auth_basic_user_file /etc/nginx/htpasswd-sluhtime-editor;

    alias /var/www/sluhtime.alvear.cl/htdocs/editor/;
    index index.html;
    expires -1;
    add_header Cache-Control "no-store";

    location ^~ /edit/api/ {
        proxy_pass http://127.0.0.1:8421;
        proxy_set_header Host $host;
        proxy_read_timeout 90s;          # "Get latest calendar" downloads the whole calendar
        client_max_body_size 1m;
    }
}

# The raw calendar download the editor re-filters lives in data/source/ on
# the server. Nothing on the site needs it, so don't serve it.
location ~ ^/data/source/.*\.ics$ { deny all; }
