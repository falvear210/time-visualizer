# nginx doesn't read .htaccess like Apache does, so the rule that keeps
# rpis_data.json from being fetched directly (bypassing the view-key check
# in rpis.php) has to live in the site's own nginx vhost instead.
#
# Under WordOps that vhost is /etc/nginx/sites-available/<domain> -- paste
# this block inside the `server { ... }` there, adjusting the path to match
# wherever you actually uploaded rpis.php (this assumes a `rpis/` subfolder
# under the site's webroot). An exact-match `location =` always wins over
# other location blocks in nginx regardless of where it's placed in the
# file, so it can't be accidentally shadowed by WordOps's own includes.
#
# After editing: sudo nginx -t && sudo systemctl reload nginx

location = /rpis/rpis_data.json {
    deny all;
    return 404;
}
