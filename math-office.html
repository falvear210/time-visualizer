<!DOCTYPE html>
<!--
  Redirect stub for the OLD URL: /math-office.html

  The wall display moved into its own folder, /math/, so that every SLUH
  Time project can live at a URL ending in "/". This file stays behind at
  the old path forever -- it is what a stale bookmark, a printed QR code,
  or a Pi kiosk that missed the config update actually hits.

  Two layers, because the kiosks run unattended:
    - the <meta refresh> works with JavaScript disabled
    - the script runs first in practice and carries ?query + #hash across

  A server-side 301 is the better answer for anything a search engine
  indexes -- that is server/nginx-office-folders.conf, pasted into the
  sluhtime.alvear.cl vhost by hand. This stub is the no-server-access
  fallback, and it deploys itself with the rest of the site.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=math/">
<link rel="canonical" href="https://sluhtime.alvear.cl/math/">
<title>Moved — SLUH Math Office Display</title>
<script>
  (function () {
    location.replace("math/" + location.search + location.hash);
  })();
</script>
</head>
<body style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;max-width:32rem;margin:4rem auto;padding:0 1rem;">
  <p>The math office display has moved to
     <a href="math/">sluhtime.alvear.cl/math/</a>.</p>
</body>
</html>
